name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: lux-build-amd64
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

      # The site is served by the Cloudflare Worker declared in wrangler.toml, which owns
      # lux.partners and www.lux.partners. This repo previously published to GitHub Pages,
      # which nothing points at any more -- pushes looked green while the domain stayed dark.
      #
      # Without credentials in the repo/org this step is skipped and the job stays a
      # build check, rather than failing every push.
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@3 deploy

      - name: Note missing credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Built but did not publish: CLOUDFLARE_API_TOKEN is not set." \
               "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy on push."
